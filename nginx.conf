server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router runs in history mode (createWebHistory) — every unknown path
    # must fall back to index.html so deep links and refreshes don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints filenames in /assets, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
